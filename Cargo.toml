[package]
name = "kicode"
version = "0.0.1"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
toml = "0.8"
dirs = "5"
glob = "0.3"
regex = "1"
walkdir = "2"
thiserror = "2"
anyhow = "1"
rpassword = "7"
async-trait = "0.1"
dotenvy = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
