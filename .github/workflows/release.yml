name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          cd target/release
          tar czvf ../../kicode-aarch64-apple-darwin.tar.gz kicode
          cd ../..

      - name: Generate SHA256
        run: shasum -a 256 kicode-aarch64-apple-darwin.tar.gz > kicode-aarch64-apple-darwin.tar.gz.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kicode-aarch64-apple-darwin.tar.gz
            kicode-aarch64-apple-darwin.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
